substitutions:
  name: "test-device"

esphome:
  name: ${name}
  platform: ESP32
  board: nodemcu-32s

logger:

uart:
  - id: uart_transport
    tx_pin: GPIO1
    rx_pin: GPIO1  # Loopback
    baud_rate: 115200

packet_transport:
  platform: uart
  id: pt
  uart_id: uart_transport
  receive_logs: true
  forward_logs:
    provider: ${name}

ota:
  - platform: packet_transport_host
    packet_transport_id: pt
    provider: ${name}
  - platform: packet_transport_remote
    packet_transport_id: pt

custom_component:
  - lambda: |-
      auto test_component = new esphome::Component();
      App.register_component(test_component);

      // Send a log message
      ESP_LOGI("test", "Hello from the test component!");

      // Trigger a fake OTA update
      auto ota_backend = static_cast<esphome::packet_transport::PacketTransportHostOTABackend*>(App.get_ota_backend(0));
      ota_backend->begin(123, "md5");
      uint8_t data[] = {1, 2, 3, 4};
      ota_backend->write(data, 4);
      ota_backend->end();
