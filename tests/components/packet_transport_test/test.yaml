substitutions:
  host_name: "host"
  remote_name: "remote"

esphome:
  name: ${host_name}
  platform: ESP32
  board: nodemcu-32s

logger:

uart:
  - id: uart_transport
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 115200

packet_transport:
  platform: uart
  id: pt
  uart_id: uart_transport
  receive_logs: true

ota:
  - platform: packet_transport_host
    packet_transport_id: pt
    provider: ${remote_name}

---

esphome:
  name: ${remote_name}
  platform: ESP32
  board: nodemcu-32s

logger:

uart:
  - id: uart_transport
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 115200

packet_transport:
  platform: uart
  id: pt
  uart_id: uart_transport
  forward_logs:
    provider: ${host_name}

ota:
  - platform: packet_transport_remote
    packet_transport_id: pt
