esphome:
  name: test-esp32-mesh

esp32:
  board: esp32dev

esp32_ble_tracker:

output:
  - platform: gpio
    pin: GPIO2
    id: output_led

switch:
  - platform: output
    name: "Mesh Switch"
    id: mesh_switch
    output: output_led

light:
  - platform: binary
    name: "Mesh Light"
    id: mesh_light
    output: output_led

bluetooth_sig_mesh:
  mesh_role: both
  enable_node: true
  enable_proxy: true
  net_key: "00112233445566778899aabbccddeeff"
  app_key: "ffeeddccbbaa99887766554433221100"
  unicast_address: 0x0002
